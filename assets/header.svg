    <rect width="110" height="250" rx="14" fill="#FFFFFF" fill-opacity=".28"/>
    <g fill="#FFFFFF" fill-opacity=".85">
      <rect x="16" y="24" width="64" height="9" rx="4"/>
      <rect x="16" y="56" width="78" height="7" rx="3"/>
      <rect x="16" y="76" width="60" height="7" rx="3"/>
      <rect x="16" y="106" width="78" height="7" rx="3"/>
      <rect x="16" y="126" width="52" height="7" rx="3"/>
    </g>
    <rect x="150" y="170" width="220" height="46" rx="12" fill="#FFFFFF" fill-opacity=".35"/>
  </g>
</svg>
