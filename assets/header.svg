<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">T3 Code Wallpaper</title>
  <desc id="desc">A wallpaper behind T3 Code, with a frosted-glass sidebar.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B3470"/><stop offset="1" stop-color="#C9A5B8"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#F5F1E9"/>
  <path d="M0 325H1280" stroke="#DED5C8"/>
  <g fill="#42362F">
    <text x="64" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">T3 Code Wallpaper</text>
    <text x="67" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="25">Your image behind T3 Code. Frosted-glass sidebar.</text>
    <text x="65" y="367" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" letter-spacing="2">A RUNTIME CSS PATCH</text>
  </g>
  <g transform="translate(820 53)">
